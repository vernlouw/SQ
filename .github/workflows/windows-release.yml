name: Windows game download

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out game source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install verified Godot 4.4.1 and Windows templates
        shell: bash
        run: |
          set -euo pipefail
          export XDG_CACHE_HOME="$RUNNER_TEMP/sq-cache"
          export XDG_DATA_HOME="$RUNNER_TEMP/sq-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/sq-config"
          echo "XDG_CACHE_HOME=$XDG_CACHE_HOME" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$XDG_DATA_HOME" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/godot" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME"
          cd "$RUNNER_TEMP/godot"
          release="https://github.com/godotengine/godot/releases/download/4.4.1-stable"
          curl --fail --show-error --silent --location --retry 3 "$release/Godot_v4.4.1-stable_linux.x86_64.zip" -o Godot_v4.4.1-stable_linux.x86_64.zip
          curl --fail --show-error --silent --location --retry 3 "$release/Godot_v4.4.1-stable_export_templates.tpz" -o Godot_v4.4.1-stable_export_templates.tpz
          cat > SHA512-verified.txt <<'SUMS'
          ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e  Godot_v4.4.1-stable_linux.x86_64.zip
          8f461c7d6e91a0fbabfc95b1e4ca70ff1732c6f2920956a16b086ec2a85b5f7e238baf4dbce60dcc5630fae3bcb9a1fa2ae2027b92cb495c02d082705715e441  Godot_v4.4.1-stable_export_templates.tpz
          SUMS
          sha512sum --check --strict SHA512-verified.txt
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          templates="$XDG_DATA_HOME/godot/export_templates/4.4.1.stable"
          mkdir -p "$templates"
          unzip -j -q Godot_v4.4.1-stable_export_templates.tpz templates/version.txt templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe -d "$templates"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import and verify the chapter
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --import
          for suite in tests/smoke.gd tests/audio_smoke.gd tests/room_bits_smoke.gd tests/burger_shift_smoke.gd tests/travel_smoke.gd tests/campaign_smoke.gd tests/campaign_ui_smoke.gd; do
            suite_name="$(basename "$suite" .gd)"
            mkdir -p "$RUNNER_TEMP/test-data/$suite_name" "$RUNNER_TEMP/test-config/$suite_name"
            log="$RUNNER_TEMP/$suite_name.log"
            if [ "$suite_name" = burger_shift_smoke ] || [ "$suite_name" = campaign_ui_smoke ]; then
              if ! command -v xvfb-run >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y xvfb libgl1-mesa-dri
              fi
              xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 XDG_DATA_HOME="$RUNNER_TEMP/test-data/$suite_name" XDG_CONFIG_HOME="$RUNNER_TEMP/test-config/$suite_name" timeout 120s "$GODOT" --audio-driver Dummy --path "$GITHUB_WORKSPACE" --script "$suite" 2>&1 | tee "$log"
            else
              env XDG_DATA_HOME="$RUNNER_TEMP/test-data/$suite_name" XDG_CONFIG_HOME="$RUNNER_TEMP/test-config/$suite_name" timeout 120s "$GODOT" --headless --audio-driver Dummy --path "$GITHUB_WORKSPACE" --script "$suite" 2>&1 | tee "$log"
            fi
            if grep -Eq 'SCRIPT ERROR|ERROR:' "$log"; then exit 1; fi
            grep -q 'PASS:' "$log"
          done

      - name: Export one Windows executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exports/windows
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --export-release "Windows Desktop" "$GITHUB_WORKSPACE/exports/windows/SpaceQuestVII.exe" 2>&1 | tee "$RUNNER_TEMP/export.log"
          if grep -Eq 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/export.log"; then exit 1; fi

      - name: Verify the embedded game pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty-project" "$RUNNER_TEMP/packed-data"
          cat > "$RUNNER_TEMP/packed-smoke.gd" <<'GDSCRIPT'
          extends SceneTree
          func _initialize() -> void:
              call_deferred("check_pack")
          func check_pack() -> void:
              var scene = load("res://main.tscn")
              assert(scene is PackedScene)
              var game = scene.instantiate()
              root.add_child(game)
              await process_frame
              assert(game.title_is_open())
              assert(game.audio.streams.size() == 35)
              assert(game.audio.streams["intro_fanfare"].get_length() > 18.0)
              assert(game.audio.streams["intro_theme"].get_length() > 330.0)
              var campaign = load("res://scripts/campaign.gd")
              assert(campaign.ROOM_NAMES.size() == 30)
              assert(game.ROOM_NAMES.size() == 30)
              for room_id in campaign.ROOM_NAMES:
                  assert(load("res://assets/room_" + room_id + ".png") is Texture2D)
              assert(load("res://assets/flight_monolith.png") is Texture2D)
              assert(load("res://assets/flight_labion.png") is Texture2D)
              for script_id in ["room_bits", "bit_visuals", "burger_shift", "shuttle_travel", "campaign"]:
                  assert(load("res://scripts/" + script_id + ".gd") is Script)
              assert(not ResourceLoader.exists("res://tests/smoke.gd"))
              assert(not ResourceLoader.exists("res://preview.png"))
              game.start_adventure()
              await process_frame
              assert(not game.title_is_open())
              assert(not game.audio.intro_active)
              game.close_dialogue()
              var story_score = game.state["score"]
              var shift = load("res://scripts/burger_shift.gd")
              game.enter_room("dock")
              game.close_dialogue()
              game.open_travel_menu()
              assert(game.travel_is_open())
              game.choose_destination("monolith")
              assert(game.flight_is_active())
              game.finish_flight()
              assert(game.state["room"] == "monolith")
              game.close_dialogue()
              var story_flags = game.state["flags"].duplicate(true)
              game.open_burger_shift()
              assert(game.burger_is_open())
              assert(game.burger_choice_buttons.size() == 3)
              for order in shift.ORDERS:
                  game.choose_burger_option(order["correct_id"])
              assert(shift.status(game)["completed"])
              assert(game.state["inventory"].count("monolith coupon") == 1)
              game.close_burger_shift()
              game.perform_action("manager", "Use", "monolith coupon")
              assert(shift.status(game)["coupon_redeemed"])
              assert(not game.has_item("monolith coupon"))
              assert(game.state["score"] == story_score)
              assert(game.state["flags"] == story_flags)
              game.close_dialogue()
              game.open_travel_menu()
              assert(game.travel_is_open())
              game.choose_destination("dock")
              assert(game.flight_is_active())
              game.finish_flight()
              assert(game.state["room"] == "dock")
              game.close_dialogue()
              game.state["flags"]["coordinates_set"] = true
              game.state["score"] = 90
              game.open_travel_menu()
              assert(game.choose_destination("labion"))
              assert(game.flight_is_active())
              game.finish_flight()
              assert(game.state["room"] == "labion_dock")
              assert(game.flag("chapter_one_complete"))
              assert(game.state["score"] == 100)
              assert(not game.flag("complete"))
              assert(not game.finale_panel.visible)
              game.close_dialogue()
              game.perform_action("pickup", "Use")
              assert(game.has_item("empty flask"))
              game.close_dialogue()
              game.open_inventory()
              assert(game.inventory_is_open())
              assert(game.inventory_grid_buttons.has("empty flask"))
              game.close_inventory()
              game.enter_room("labion_bog")
              game.close_dialogue()
              var retry_state = game.state.duplicate(true)
              game.perform_action("object", "Use")
              assert(game.death_is_open())
              game.retry_death()
              assert(not game.death_is_open())
              assert(game.state == retry_state)
              game.close_dialogue()
              for room_id in ["plexi_plaza", "starcon_class", "polysorbate_market", "glitzon_boulevard"]:
                  game.enter_room(room_id)
                  game.perform_action("object", "Look")
                  assert(game.dialogue_panel.visible)
                  game.close_dialogue()
              game.new_game(false)
              game.state["score"] = 280
              for artifact in campaign.ARTIFACTS:
                  game.add_item(artifact)
              game.add_item("fryer sludge")
              game.enter_room("clone_chamber")
              game.perform_action("object", "Use")
              game.close_dialogue()
              game.perform_action("object", "Use", "fryer sludge")
              game.close_dialogue()
              game.perform_action("pickup", "Use")
              game.close_dialogue()
              game.perform_action("object", "Use")
              assert(game.flag("complete"))
              assert(game.state["score"] == 300)
              assert(game.finale_panel.visible)
              assert(game.has_item("mop of destiny"))
              for artifact in campaign.ARTIFACTS:
                  assert(game.has_item(artifact))
              print("PASS: 30 packed rooms, 35 audio cues, Labion continuation, inventory, Retry and finale fixture")
              game.queue_free()
              await process_frame
              await process_frame
              await create_timer(0.25).timeout
              quit()
          GDSCRIPT
          env XDG_DATA_HOME="$RUNNER_TEMP/packed-data" timeout 45s "$GODOT" --headless --audio-driver Dummy --path "$RUNNER_TEMP/empty-project" --main-pack "$GITHUB_WORKSPACE/exports/windows/SpaceQuestVII.exe" --script "$RUNNER_TEMP/packed-smoke.gd" 2>&1 | tee "$RUNNER_TEMP/packed.log"
          if grep -Eq 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/packed.log"; then exit 1; fi
          grep -q 'PASS:' "$RUNNER_TEMP/packed.log"
          cp tests/campaign_smoke.gd "$RUNNER_TEMP/campaign-packed-smoke.gd"
          mkdir -p "$RUNNER_TEMP/packed-campaign-data" "$RUNNER_TEMP/packed-campaign-config"
          env XDG_DATA_HOME="$RUNNER_TEMP/packed-campaign-data" XDG_CONFIG_HOME="$RUNNER_TEMP/packed-campaign-config" timeout 180s "$GODOT" --headless --audio-driver Dummy --path "$RUNNER_TEMP/empty-project" --main-pack "$GITHUB_WORKSPACE/exports/windows/SpaceQuestVII.exe" --script "$RUNNER_TEMP/campaign-packed-smoke.gd" 2>&1 | tee "$RUNNER_TEMP/packed-campaign.log"
          if grep -Eq 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/packed-campaign.log"; then exit 1; fi
          grep -q 'PASS:' "$RUNNER_TEMP/packed-campaign.log"

      - name: Package Windows download
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 https://raw.githubusercontent.com/godotengine/godot/4.4.1-stable/LICENSE.txt -o exports/windows/LICENSE-Godot.txt
          curl --fail --show-error --silent --location --retry 3 https://raw.githubusercontent.com/godotengine/godot/4.4.1-stable/COPYRIGHT.txt -o exports/windows/COPYRIGHT-Godot.txt
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import os
          import struct
          import zipfile
          folder = Path("exports/windows")
          exe = folder / "SpaceQuestVII.exe"
          binary = exe.read_bytes()
          assert binary[:2] == b"MZ"
          pe = struct.unpack_from("<I", binary, 0x3c)[0]
          assert binary[pe:pe+4] == b"PE\x00\x00"
          assert struct.unpack_from("<H", binary, pe+4)[0] == 0x8664
          assert struct.unpack_from("<H", binary, pe+24)[0] == 0x20b
          assert struct.unpack_from("<H", binary, pe+24+68)[0] == 2
          assert binary[-4:] == b"GDPC"
          (folder / "README.txt").write_text(
              "SPACE QUEST VII: MOPOCALYPSE NOW\n"
              "Windows edition - 30 playable screens / 300 points\n\n"
              f"Source revision: {os.environ['GITHUB_SHA']}\n\n"
              "HOW TO PLAY\n"
              "1. Extract this entire ZIP into a folder.\n"
              "2. Double-click SpaceQuestVII.exe. No Godot installation is required.\n"
              "3. Choose New Game or Continue. The intro music can be skipped immediately.\n\n"
              "CONTROLS\n"
              "Left-click the floor to walk; click people to talk and objects to interact.\n"
              "Right-click an object to inspect it. Click an inventory item, then its target.\n"
              "I opens your full inventory. Sound or M opens audio controls.\n"
              "F5 saves, F9 loads, and H shows a hint.\n\n"
              "Tab highlights clickable objects. Explore them for optional jokes.\n\n"
              "THE STORY\n"
              "Recover six legendary cleaning artifacts and stop R0-GER's universal wipe.\n"
              "The opening museum investigation leads to Labion, Monolith's back rooms,\n"
              "Plexi-Prime, StarCon, Polysorbate LX, Glitzon and the clone's final chamber.\n"
              "Shuttle routes unlock as you solve each region's puzzles.\n"
              "Comic failures offer Retry and preserve your puzzle progress.\n"
              "STORY_30_SCREENS.md lists all 30 screens and contains a full walkthrough.\n"
              "The walkthrough includes spoilers; open it when you want help or a breakdown.\n\n"
              "MONOLITH BURGER SIDE QUEST\n"
              "At Service Dock 7, click the shuttle and choose Monolith Burger.\n"
              "After the flight, explore the restaurant and take its relief shift.\n"
              "You can retry freely. Use the earned COUPON on the manager for your meal.\n"
              "Use the berth's shuttle to return or follow your next unlocked route.\n"
              "This optional job does not change the main story's /300 score.\n\n"
              "REQUIREMENTS\n"
              "64-bit Windows 10 or 11, with an OpenGL 3.3 compatible graphics driver.\n\n"
              "Game saves and audio preferences are stored in your Windows user account.\n"
              "This ZIP contains the game and music together in one executable.\n\n"
              "Built with Godot Engine 4.4.1. Engine license and third-party notices are\n"
              "included as LICENSE-Godot.txt and COPYRIGHT-Godot.txt.\n",
              encoding="utf-8",
          )
          archive = Path("exports/SpaceQuestVII-Windows.zip")
          (folder / "STORY_30_SCREENS.md").write_bytes(Path("docs/STORY_30_SCREENS.md").read_bytes())
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as bundle:
              for name in ["SpaceQuestVII.exe", "README.txt", "STORY_30_SCREENS.md", "LICENSE-Godot.txt", "COPYRIGHT-Godot.txt"]:
                  bundle.write(folder / name, name)
          with zipfile.ZipFile(archive) as bundle:
              assert bundle.testzip() is None
          print("Windows ZIP bytes:", archive.stat().st_size)
          digest = hashlib.file_digest(archive.open("rb"), "sha256").hexdigest()
          Path("exports/SHA256SUMS.txt").write_text(digest + "  SpaceQuestVII-Windows.zip\n", encoding="ascii")
          print("Windows ZIP SHA256:", digest)
          PYTHON

      - name: Retain the tested build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SpaceQuestVII-Windows
          path: |
            exports/SpaceQuestVII-Windows.zip
            exports/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

      - name: Publish the Windows download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_tag="windows-${GITHUB_SHA:0:12}"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Download **SpaceQuestVII-Windows.zip**, extract it, and double-click **SpaceQuestVII.exe**. Godot is not required.

          This build contains a complete 300-point campaign across 30 playable rooms, six legendary artifacts, interplanetary shuttle travel, regional puzzles, optional Monolith Burger work, comic Retry scenes and supplied SQ5/SQ6 introduction recordings. The ZIP includes the 30-screen breakdown and complete walkthrough in STORY_30_SCREENS.md.

          The source and embedded game pack passed the automated Linux Godot checks. Native Windows launch has not yet been tested here.
          NOTES
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" exports/SpaceQuestVII-Windows.zip exports/SHA256SUMS.txt --clobber
            gh release edit "$release_tag" --latest --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$release_tag" exports/SpaceQuestVII-Windows.zip exports/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Space Quest VII - Windows build ${GITHUB_SHA:0:7}" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
